<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة رسم لا نهائية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لوحتي">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo&family=Tajawal&family=Almarai&family=Amiri&family=Reem+Kufi&family=Aref+Ruqaa&family=Lateef&family=El+Messiri&family=Changa&family=Lemonada&family=Marhey&family=Rakkas&family=Katibeh&family=Noto+Kufi+Arabic&family=Noto+Naskh+Arabic&family=Baloo+Bhaijaan+2&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#e9ebf2;--ui:#fff;--ui2:#f1f2f7;--tx:#16171d;--mu:#6b6f80;--ac:#6366f1;--ac2:#a855f7;--bd:#dfe1ea;--sh:0 10px 34px rgba(20,20,50,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c12;--ui:#181822;--ui2:#242434;--tx:#f4f4f8;--mu:#9a9db0;--ac:#818cf8;--ac2:#c084fc;--bd:#2f2f44;--sh:0 10px 34px rgba(0,0,0,.65)}}
:root[data-theme="dark"]{--bg:#0c0c12;--ui:#181822;--ui2:#242434;--tx:#f4f4f8;--mu:#9a9db0;--ac:#818cf8;--ac2:#c084fc;--bd:#2f2f44;--sh:0 10px 34px rgba(0,0,0,.65)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
textarea,input{-webkit-user-select:text;user-select:text}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;font-size:13px;color:var(--tx);background:var(--ui2);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;cursor:pointer;flex:none;line-height:1.3;transition:transform .08s,background .15s}
button:active{transform:scale(.95)}
button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
button.rec{background:#dc2626;color:#fff;border-color:#dc2626}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--ui);border-bottom:1px solid var(--bd);z-index:7;flex:none}
.ib{width:38px;height:38px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;border:none}
.ttl{border:none;font-weight:700;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zm{font-size:11px;font-weight:700}
#wrap{flex:1;position:relative;min-height:0;background:#fff;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ti{position:absolute;margin:0;padding:0;background:transparent;outline:none;min-width:60px;resize:none;overflow:hidden;white-space:pre;line-height:1.2;z-index:2}
#bar{background:var(--ui);border-radius:22px 22px 0 0;padding:4px 8px 6px;box-shadow:0 -6px 24px rgba(0,0,0,.12);z-index:7;flex:none}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:3px 2px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
button.tl{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px;padding:5px 6px 4px;font-size:10.5px;background:transparent;border:1px solid transparent;color:var(--mu);border-radius:14px}
button.tl i{font-style:normal;font-size:20px;line-height:1.1}
button.tl.on{color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.45)}
.qb{display:flex;align-items:center;gap:4px}
#chip{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);vertical-align:middle}
#sw,#np{display:flex;gap:6px}
#sw button,#sc button,#np button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--bd)}
#sw button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
#sz{width:96px;flex:none;accent-color:var(--ac)}
#fn{flex:none;max-width:112px;font:inherit;font-size:12px;padding:4px;border:1px solid var(--bd);border-radius:10px;background:var(--ui2);color:var(--tx)}
#fn option{color:#000}
#sel{position:absolute;transform:translate(-50%,-100%);display:flex;gap:4px;background:var(--ui);border:1px solid var(--bd);border-radius:14px;padding:4px;z-index:3;box-shadow:var(--sh)}
#sel button{padding:5px 8px}
#ts{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:7px 16px;border-radius:22px;font-size:13px;z-index:9;max-width:90%;text-align:center}
#mini{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:6}
#mini button{width:38px;height:38px;border-radius:50%;padding:0;font-size:16px;box-shadow:var(--sh);background:var(--ui)}
#chip2{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:5px 14px;border-radius:22px;font-weight:700;font-size:13px;z-index:6;box-shadow:var(--sh);cursor:pointer}
#bnav,#pnav{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ui);padding:5px 8px;border-radius:30px;box-shadow:var(--sh);z-index:5;font-size:13px}
#pgi,#vgo{width:54px;font:inherit;padding:3px;border:1px solid var(--bd);border-radius:8px;background:var(--ui2);color:var(--tx);text-align:center}
.pop{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);box-sizing:border-box;z-index:4;background:var(--ui);border:1px solid var(--bd);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 12px 16px;box-shadow:var(--sh);max-height:74%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.pop::before{content:'';display:block;width:42px;height:4px;border-radius:4px;background:var(--bd);margin:-6px auto 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;font-size:12px;font-weight:600}
.tile i{font-style:normal;font-size:26px}
.ph{font-size:12px;color:var(--mu);margin:8px 0 6px;font-weight:700}
.pgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wr{display:flex;gap:6px;margin-bottom:6px}
.bkin,#wn{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--ui2);color:var(--tx);margin-bottom:6px}
.eqr2{display:flex;gap:6px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.sr select{font:inherit;padding:4px;background:var(--ui2);color:var(--tx);border:1px solid var(--bd);border-radius:8px}
.sr input[type=range]{accent-color:var(--ac);width:110px}
#pn{max-width:360px}
#pn canvas{position:static;display:block;width:100%;touch-action:none;border-radius:10px;margin-bottom:8px}
#svc{height:150px}#huc{height:22px}
.pr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#hx{width:84px;font:inherit;padding:5px;border:1px solid var(--bd);border-radius:8px;background:var(--ui2);color:var(--tx)}
#col{width:40px;height:30px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
#sc{display:flex;flex-wrap:wrap;gap:6px}
#bp{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
#bp button,.bgs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-size:12px}
#bp canvas,.bgs canvas{width:100px;height:34px;border-radius:6px;display:block;position:static}
.bgs canvas{height:56px;width:90px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
#ap{display:flex;gap:8px;flex-wrap:wrap}
.win{position:fixed;z-index:9;background:var(--ui);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.wh{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--ui2);cursor:grab;touch-action:none;font-size:13px;font-weight:700}
.wh span{flex:1}
#yw{width:min(92vw,340px)}
#yin{display:flex;gap:6px;padding:6px}
#yin input{flex:1;min-width:0;font:inherit;padding:5px;border:1px solid var(--bd);border-radius:8px;background:var(--ui2);color:var(--tx)}
#yb{position:relative;aspect-ratio:16/9;background:#000}
#yf{width:100%;height:100%;border:0;display:block}
.drg #yf{pointer-events:none}
#yoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
#yr{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--ac) 50%)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.ring{position:relative;width:190px;height:190px;margin:4px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:var(--ui2);stroke-width:9}
.rf{fill:none;stroke:url(#none);stroke:var(--ac);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tmt{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
#tml{font-size:13px;color:var(--mu)}
.tbt{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.tbt .big{width:64px;height:44px;font-size:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none}
.tcfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.tcfg label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:3px}
.tcfg input{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--ui2);color:var(--tx)}
.tcfg .chk{grid-column:1/3;flex-direction:row;align-items:center;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tnote{text-align:center;font-size:13px;color:var(--mu);margin:4px 0}
#calc{width:min(96vw,350px);background:#23262b;border-color:#111;color:#fff;max-height:calc(100vh - 70px);overflow:auto}
#calc .wh{background:#15171a;color:#ddd}
#calc .wh button{background:#2c3036;color:#fff;border-color:#111}
#cmodes{display:flex;gap:4px;padding:6px 8px 0}
#cmodes button{flex:1;padding:4px 0;font-size:11px;background:#2c3036;color:#cfd3da;border-color:#111}
#cmodes button.on{background:#f2b705;color:#111}
#clcd{margin:8px;background:#cbd5b8;color:#1b2415;border-radius:8px;padding:6px 10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.35);min-height:78px;font-family:ui-monospace,Menlo,monospace}
#cs{height:14px;font-size:10px;display:flex;gap:8px;font-weight:700}
#cx{font-size:17px;min-height:26px;word-break:break-all;direction:ltr;text-align:left}
#cr{font-size:24px;text-align:right;direction:ltr;font-weight:700;min-height:30px}
.cc{display:inline-block;width:2px;height:1em;background:#1b2415;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#cctl{display:flex;gap:6px;padding:0 8px 6px}
#cctl button,#cctl select{background:#2c3036;color:#fff;border:1px solid #111;border-radius:8px;font-size:11px;padding:3px 8px}
#cctl button.on{background:#f2b705;color:#111}
.crow{display:flex;gap:5px;padding:0 8px 5px}
.ck{flex:1;position:relative;height:34px;padding:0;background:#3b3f46;color:#fff;border:none;border-radius:8px;box-shadow:0 2px 0 #111;font-size:12px}
.ck.kd{height:42px;background:#565b64;font-size:16px;font-weight:700}
.ck.kc{background:#d6532f;font-weight:700}.ck.kc2{background:#8a4b2e}
.ck.ke{height:42px;background:#2f6fe4;font-size:18px;font-weight:700}
.ck.ks{background:#f2b705;color:#111;font-weight:700}.ck.ka{background:#e5484d;font-weight:700}
.ck .sl{position:absolute;top:1px;left:4px;font-size:8.5px;color:#f2b705;font-style:normal}
.ck .al{position:absolute;top:1px;right:4px;font-size:8.5px;color:#ff7b7f;font-style:normal;font-weight:700}
.ck b{font-weight:600}
#cform{padding:8px;color:#fff}
#cform label{display:flex;flex-direction:column;font-size:11px;gap:2px;flex:1}
#cform input,#cform select,#cform textarea{background:#15171a;color:#fff;border:1px solid #444;border-radius:6px;padding:5px;font:inherit;width:100%;box-sizing:border-box}
.eqr{display:flex;gap:6px;margin:6px 0}
.cgo{width:100%;padding:8px;background:#f2b705;color:#111;font-weight:700;margin:6px 0;border:none}
.cout{background:#cbd5b8;color:#1b2415;border-radius:8px;padding:8px;min-height:30px;font-family:ui-monospace,monospace;direction:ltr;text-align:left;font-size:13px}
.ctb{width:100%;border-collapse:collapse}.ctb td,.ctb th{border:1px solid #6a7a5a;padding:2px 6px}
#vw{position:fixed;inset:0;z-index:8;background:var(--ui);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#vh{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd)}
#vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}
#vnav{display:flex;align-items:center;gap:4px;font-size:12px}
#vb{flex:1;overflow:auto;padding:8px;background:rgba(128,128,128,.35);touch-action:pan-x pan-y pinch-zoom;-webkit-user-select:text;user-select:text}
.vpg{background:#fff;margin:0 auto 10px;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.vdoc{background:#fff;color:#111;max-width:900px;margin:0 auto;padding:16px;line-height:1.7;overflow:auto}
.vdoc img{max-width:100%}.vdoc table{border-collapse:collapse}.vdoc td,.vdoc th{border:1px solid #999;padding:4px}
.vtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.vxl{background:#fff;color:#111;overflow:auto}.vxl table{border-collapse:collapse}.vxl td{border:1px solid #bbb;padding:3px 6px;white-space:nowrap}
.vsl{position:relative;background:#fff;margin:0 auto 12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.vtxt{background:#fff;color:#111;padding:12px;white-space:pre-wrap;margin:0}.vmsg{padding:30px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#mb{background:var(--ui);border-radius:16px;padding:12px;max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
#mb img{max-width:100%;max-height:55vh;background:#fff;border-radius:8px}
#mb a{color:var(--ac)}

</style>
</head>
<body>
<div id="app">
 <div id="top">
  <button id="menub" class="ib">☰</button>
  <button id="wsb" class="ttl">🗂 مساحتي</button>
  <button id="pgb" class="ttl">📄 صفحة 1</button>
  <span style="flex:1"></span>
  <button id="un" class="ib">↩️</button><button id="re" class="ib">↪️</button>
  <button id="hm" class="ib" title="رجوع للنص"><span id="zm">100%</span></button>
 </div>
 <div id="wrap">
  <canvas id="c"></canvas>
  <textarea id="ti" hidden rows="1" dir="ltr"></textarea>
  <div id="sel" hidden><button data-a="del">🗑</button><button data-a="col">🎨</button><button data-a="up">➕</button><button data-a="dn">➖</button><button data-a="dup">⧉</button><button data-a="fr">⬆</button><button data-a="view" hidden>👁</button></div>
  <div id="ts" hidden></div>
  <div id="chip2" hidden></div>
  <div id="mini"><button id="mu" hidden>↩️</button><button id="tg">⌄</button></div>
  <div id="bnav" hidden><button id="bpv">◀</button><button id="bcv">📕</button><span id="bpi"></span><button id="bnx">▶</button></div>
  <div id="pnav" hidden><button id="pgp">◀</button><input id="pgi" type="number" min="1"><span id="pgt"></span><button id="pgn">▶</button></div>
  <div id="pn" class="pop" hidden>
   <canvas id="svc" width="260" height="150"></canvas><canvas id="huc" width="260" height="22"></canvas>
   <div class="pr"><input id="hx" maxlength="7" dir="ltr"><input type="color" id="col" value="#1e1e1e"><button id="addc">➕ حفظ اللون</button></div>
   <div id="sc"></div>
  </div>
  <div id="bp" class="pop" hidden></div>
  <div id="pp" class="pop" hidden></div>
  <div id="wp" class="pop" hidden></div>
  <div id="bk" class="pop" hidden></div>
  <div id="tmp" class="pop" hidden></div>
  <div id="ap" class="pop" hidden>
   <button data-f="image/*">🖼️ صورة</button><button data-f="video/*">🎬 فيديو</button><button data-f="audio/*">🎵 ملف صوتي</button>
   <button data-f=".pdf,application/pdf" data-pdf="1">📌 PDF على اللوحة (اكتب فوقه)</button>
   <button data-f=".pdf,.doc,.docx,.xls,.xlsx,.xlsm,.csv,.ppt,.pptx,.txt,application/pdf">📄 مستند (PDF/Word/Excel/PPT) كبطاقة</button>
   <button data-f="*/*">📎 أي ملف</button>
  </div>
  <div id="tp" class="pop" hidden>
   <div class="ph">🛠 الأدوات والمساحات</div>
   <div class="tiles">
    <button class="tile" id="calcb"><i>🧮</i>الحاسبة العلمية</button>
    <button class="tile" id="timb"><i>🍅</i>بومودورو والمؤقت</button>
    <button class="tile" id="ytb"><i>▶️</i>يوتيوب</button>
    <button class="tile" id="pdfb"><i>📄</i>PDF على اللوحة</button>
    <button class="tile" id="add"><i>📎</i>إضافة ملف/صورة</button>
    <button class="tile" id="mic"><i>🎙️</i>تسجيل صوتي</button>
    <button class="tile" id="wsb2"><i>🗂</i>المساحات</button>
    <button class="tile" id="pgb2"><i>📖</i>الصفحات</button>
    <button class="tile" id="bookb"><i>📓</i>دفتر جديد</button>
    <button class="tile" id="sv"><i>💾</i>حفظ كصورة</button>
    <button class="tile" id="cl"><i>🧹</i>مسح الصفحة</button>
    <button class="tile" id="stb"><i>⚙️</i>الإعدادات</button>
   </div>
  </div>
  <div id="sp" class="pop" hidden>
   <div class="ph">⚙️ إعدادات التطبيق</div>
   <div class="sr"><span>شكل التطبيق</span><select id="s-th"><option value="auto">تلقائي</option><option value="light">فاتح</option><option value="dark">داكن</option></select></div>
   <div class="ph">الرسم</div>
   <div class="sr"><span>تنعيم الخط</span><span><input type="range" id="s-st" min="0" max="85"> <b id="s-stv"></b></span></div>
   <div class="sr"><span>تحويل الخط لشكل بالضغط المطوّل</span><input type="checkbox" id="s-sn"></div>
   <div class="sr"><span>مدة الضغط المطوّل</span><span><input type="range" id="s-ho" min="300" max="1500" step="50"> <b id="s-hov"></b></span></div>
   <div class="sr"><span>الرسم بالقلم فقط (الإصبع يحرّك)</span><input type="checkbox" id="s-po"></div>
   <div class="ph">الصوت</div>
   <div class="sr"><span>تشغيل الأصوات</span><input type="checkbox" id="s-sd"></div>
   <div class="sr"><span>مستوى الصوت</span><span><input type="range" id="s-vl" min="0" max="100"> <b id="s-vlv"></b></span></div>
   <div class="sr"><span>صوت الأقلام وقت الكتابة</span><input type="checkbox" id="s-ps"></div>
   <div class="sr"><span>أصوات الواجهة وقلب الصفحات</span><input type="checkbox" id="s-ui"></div>
   <div class="ph">التخزين</div>
   <div class="sr"><span>المساحة المستخدمة</span><b id="s-us">…</b></div>
   <div class="pgs" style="margin-top:8px"><button id="s-wh">💾 حفظ الآن</button><button id="s-up">🔄 تحديث التطبيق</button></div>
  </div>

$('s-vl').onchange=()=>uiSound('chime');
$('s-ps').onchange=e=>{S.penSnd=e.target.checked;saveSet()};
$('s-ui').onchange=e=>{S.uiSnd=e.target.checked;saveSet();uiSound('pop')};
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))uiSound('click')},true);
bookInit();studyInit();

applySet();$('wsb').textContent='🗂 '+WS[ws].name;
mark();resize();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{if(!lsGet('inf-off')){lsSet('inf-off','1');toast('جاهز للعمل بدون إنترنت ✓')}}).catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(navigator.onLine&&!lsGet('inf-fonts')&&document.fonts){setTimeout(()=>{Promise.all(FN.map(([f])=>document.fonts.load('16px "'+f+'"','ابتثجحخ Abc'))).then(()=>lsSet('inf-fonts','1')).catch(()=>{})},4000)}
</script>
</body>
